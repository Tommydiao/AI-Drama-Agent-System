services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_drama
      POSTGRES_USER: ai_drama
      POSTGRES_PASSWORD: ai_drama_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  postgres-data:

